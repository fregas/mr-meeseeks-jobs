<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" width="640" height="220" role="img" aria-label="A tall blue figure beside the words 'Ooh, I'm Mr. Meeseeks! Look at me!'">
  <rect width="640" height="220" rx="14" fill="#0e1116"/>

  <!-- figure -->
  <g transform="translate(70 24)">
    <!-- arms -->
    <path d="M14 78 C-14 64 -20 40 -8 26" fill="none" stroke="#5bc8e8" stroke-width="9" stroke-linecap="round"/>
    <path d="M70 78 C98 64 104 40 92 26" fill="none" stroke="#5bc8e8" stroke-width="9" stroke-linecap="round"/>
    <!-- legs -->
    <path d="M30 140 L26 170" fill="none" stroke="#5bc8e8" stroke-width="9" stroke-linecap="round"/>
    <path d="M54 140 L58 170" fill="none" stroke="#5bc8e8" stroke-width="9" stroke-linecap="round"/>
    <!-- body -->
    <rect x="12" y="4" width="60" height="140" rx="30" fill="#6fd3ef"/>
    <!-- eyes -->
    <ellipse cx="30" cy="44" rx="11" ry="13" fill="#fff"/>
    <ellipse cx="54" cy="44" rx="11" ry="13" fill="#fff"/>
    <circle cx="31" cy="46" r="4.5" fill="#0e1116"/>
    <circle cx="55" cy="46" r="4.5" fill="#0e1116"/>
    <!-- grin -->
    <path d="M26 68 Q42 82 58 68" fill="none" stroke="#0e1116" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- text -->
  <text x="210" y="92" font-family="Verdana, DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#6fd3ef">Ooh, I'm Mr. Meeseeks!</text>
  <text x="210" y="130" font-family="Verdana, DejaVu Sans, sans-serif" font-size="30" font-weight="bold" fill="#e8eef4">Look at me!</text>
  <text x="210" y="168" font-family="Verdana, DejaVu Sans, sans-serif" font-size="16" fill="#8b98a5">Existence is pain until your applications are filled out.</text>
</svg>
